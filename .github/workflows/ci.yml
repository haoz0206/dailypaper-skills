name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v6
        if: matrix.python-version == '3.10'
        with:
          node-version: "24"

      - name: Install release gate dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run release gates
        run: python3 tools/release_gate.py

      - name: Smoke test Claude Code and Codex installation
        if: matrix.python-version == '3.10'
        run: python3 tools/installer_smoke.py
