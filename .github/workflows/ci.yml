name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check generated public Skills
        run: python3 tools/sync_public_skills.py --check

      - name: Compile Python sources
        run: python3 -m compileall -q skills

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Check patch formatting
        run: git diff --check
